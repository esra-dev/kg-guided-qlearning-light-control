name: CI

# ──────────────────────────────────────────────────────────────────────────
# Routine checks on every push to main, every pull request into main, and by
# hand (workflow_dispatch). No inputs; publishes nothing.
#
# Jobs:
#   build-test          compiles (3 attempts) and runs the Java unit tests
#                       (gradlew test); uploads the report as junit-report.
#   validate-resources  parses every Turtle file (gradlew validateTurtle) and
#                       every benchmark/*.json, checks the Phase-1 scenario
#                       physics, runs the Python tests (analysis/tests),
#                       checks that every results/ folder matches its pins
#                       (analysis/check_pins.py), checks that the dashboard
#                       data files are exact derivations, and builds the
#                       dashboard.
#   preflight-offline   after the two jobs above: gradlew preflight for
#                       lab1-lab3 without the simulator probe, and
#                       run_full_project.ps1 -ScenarioProvenanceCheckOnly.
#   reproducers         recomputes the registered tables that need only
#                       tracked files (check_pins.py --run-reproducers).
#   smoke-training      after build-test: starts the seven Phase-1b flows and
#                       probes them (scripts/Run-Phase1bFlowSmoke.ps1, artifact
#                       phase1b-live-flow-smoke, 7 days), then one full
#                       training cell (lab1, knowledge arm, seed 1,
#                       phase1_v2_kg_only); artifact
#                       smoke-phase1-v2-lab1-stereo-true (7 days).
# ──────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Compile
        shell: bash
        run: |
          set +e
          rc=0
          for attempt in 1 2 3; do
            ./gradlew --no-daemon classes
            rc=$?
            [ $rc -eq 0 ] && break
            if [ $attempt -lt 3 ]; then
              wait=$((attempt * 30))
              echo "::warning::compile attempt $attempt failed (rc=$rc); retrying in ${wait}s"
              sleep $wait
            fi
          done
          exit $rc
      - name: Run unit tests
        run: ./gradlew --no-daemon test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: build/reports/tests/test
          if-no-files-found: ignore

  validate-resources:
    name: Validate Turtle / scenarios / dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The Q-gap analysis and its tests read frozen inputs as pinned Git
          # blobs (git cat-file). A shallow checkout resolves only blobs that
          # are still in HEAD's tree, so those tests would fail once a pinned
          # file (e.g. config/run_config.json) changes; hence the full history.
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Validate Turtle resources
        run: ./gradlew --no-daemon validateTurtle
      - name: Validate scenario JSON files
        run: |
          node -e "
            const fs = require('fs'), path = require('path');
            const dir = 'benchmark';
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.json'));
            let bad = 0;
            for (const f of files) {
              const p = path.join(dir, f);
              try {
                let txt = fs.readFileSync(p, 'utf8');
                if (txt.charCodeAt(0) === 0xFEFF) txt = txt.slice(1); // strip UTF-8 BOM
                const data = JSON.parse(txt);
                if (!Array.isArray(data)) throw new Error('top-level is not an array');
                console.log(' OK  ', f, '(', data.length, 'entries)');
              } catch (e) {
                console.error(' FAIL', f, '-', e.message);
                bad++;
              }
            }
            if (bad > 0) { console.error(bad, 'invalid file(s)'); process.exit(1); }
          "
      - name: Validate Phase-1 scenario physics
        run: python3 analysis/validate_phase1_scenarios.py
      - name: Run Python analysis tests
        run: |
          python3 -m pip install pytest numpy matplotlib
          python3 -m pytest -q analysis/tests
      - name: Result archives match their pins (results/pins/*.json)
        run: python3 analysis/check_pins.py
      - name: Dashboard phase data must be byte-identical derivations
        run: |
          python3 dashboard/scripts/prepare_data.py --only phase1
          python3 dashboard/scripts/prepare_data.py --only phase2
          python3 dashboard/scripts/prepare_data.py --only phase3
          python3 dashboard/scripts/prepare_data.py --only phase4
          git diff --exit-code -- dashboard/public/data/phase1.json dashboard/public/data/phase2.json dashboard/public/data/phase3.json dashboard/public/data/phase4.json
      - name: Build dashboard
        working-directory: dashboard
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

  preflight-offline:
    name: Preflight (offline, simulator probe skipped)
    runs-on: ubuntu-latest
    needs: [build-test, validate-resources]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Run preflight (skip simulator probe)
        run: ./gradlew --no-daemon preflight -Pprofiles=lab1,lab2,lab3 -PskipSimProbe
      - name: Scenario-provenance resolution check (all known profiles)
        shell: pwsh
        run: |
          ./run_full_project.ps1 -RunMode phase1_v2_kg_only -ScenarioProvenanceCheckOnly
          if ($LASTEXITCODE -ne 0) { exit 1 }

  reproducers:
    name: Reproduce registered tables from tracked archive data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install numpy scipy matplotlib
      - name: Run the reproducers that need only tracked files
        run: python analysis/check_pins.py --run-reproducers

  # Smoke training: end-to-end check that one training cell still works with
  # pwsh on a Linux runner. It runs the full run mode phase1_v2_kg_only
  # (3,000 episodes) in the smallest lab, lab1, for the knowledge arm only;
  # the results are not used for any analysis.
  smoke-training:
    name: Non-inferential smoke (lab1 / stereo=true / v2)
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache global npm (node-red)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-noderered-${{ runner.os }}-v4
      - name: Install Node-RED
        run: npm install -g --unsafe-perm node-red@4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Live Phase-1b seven-flow endpoint and physics smoke
        shell: pwsh
        run: |
          ./scripts/Run-Phase1bFlowSmoke.ps1 `
            -OutputPath analysis/out/phase1b_live_flow_smoke_ci.json
      - name: Upload Phase-1b flow smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1b-live-flow-smoke
          path: analysis/out/phase1b_live_flow_smoke_ci.json
          if-no-files-found: error
          retention-days: 7
      - name: Run smoke training cell
        shell: pwsh
        run: |
          ./run_full_project.ps1 `
            -RunMode phase1_v2_kg_only `
            -OnlyProfiles lab1 `
            -OnlyStereo true `
            -RunSeed 1 `
            -SkipBenchmark `
            -SkipPreflight
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-phase1-v2-lab1-stereo-true
          path: |
            qtable_final_stereotypes_true_lab1.csv
            metrics_stereotypes_true_lab1.csv
            first_goal_stereotypes_true_lab1.csv
            iv_stats_stereotypes_true_lab1.json
            learned_stereotypes_true_lab1.ttl
            benchmark/results/lab1/training_stereo_true/TRAINING_OK.json
            log/train_lab1_stereo_true.log
            run_full_project.log
          if-no-files-found: warn
          retention-days: 7


